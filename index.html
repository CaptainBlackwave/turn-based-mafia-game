<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f6ecd9" />
    <title>Strata</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='14' height='26' rx='5' fill='%23fff8' stroke='%235a4632' stroke-width='2'/%3E%3Crect x='10' y='20' width='12' height='8' rx='3' fill='%23c8553d'/%3E%3Crect x='10' y='13' width='12' height='7' fill='%23f2a541'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-title">
          <span class="brand"><span class="brand-name">Strata</span> <em id="challenge-tag" class="tag" hidden>Tall jars</em></span>
          <span id="level-label" class="level-label">Level 1</span>
        </div>
        <div class="hud-moves"><span id="moves">0</span> pours</div>
      </header>
      <main id="board" class="board" aria-label="Sand jars"></main>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <nav class="toolbar" aria-label="Tools">
        <button id="btn-undo" class="tool" type="button" title="Undo (Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <span>Undo</span>
        </button>
        <button id="btn-restart" class="tool" type="button" title="Restart (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
          <span>Restart</span>
        </button>
        <button id="btn-jar" class="tool" type="button" title="Add an empty jar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M9 3v3.5c-2 1-3 2.6-3 4.5v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8c0-1.9-1-3.5-3-4.5V3" /><path d="M12 11v6M9 14h6" /></svg>
          <span>Jar</span>
          <b id="jar-count" class="badge">1</b>
        </button>
        <button id="btn-hint" class="tool" type="button" title="Hint (H)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z" /></svg>
          <span>Hint</span>
        </button>
      </nav>
      <div id="win" class="win" hidden>
        <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
          <div class="win-jars" aria-hidden="true"><i></i><i></i><i></i></div>
          <h2 id="win-title">Level cleared</h2>
          <p id="win-text">All jars sorted.</p>
          <button id="btn-next" class="primary" type="button">Next level</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
